apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mage-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mage-deployment
  minReplicas: 1
  maxReplicas: 3   
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50  # Scales up if average CPU crosses 50% of the requested 250m